name: Endpoint
description: Track one backend endpoint
labels: ['area:server']
body:
  - type: input
    id: route
    attributes:
      label: Method and path
      placeholder: GET /listings/:id
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - Abbas
        - Wazan
        - Youssef
        - Ayk
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements section
      description: Link to the section of the requirements document.
    validations:
      required: true
  - type: textarea
    id: pages
    attributes:
      label: Pages affected
      placeholder: Browse, Listing Details
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: Documented in Swagger
        - label: Tests for success and each failure
        - label: Messages match the requirements exactly
        - label: Page wired with loading, success and error feedback
        - label: Reviewed
